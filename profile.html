<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="data:,">
  <title>The Rich Button</title>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const sources = params.getAll('source');
      const source = sources.length === 1 ? sources[0] : '';
      let destination = '/';

      if (['instagram', 'tiktok', 'youtube'].includes(source)) {
        // Boundaries are midnight in Bratislava. The end of each interval is exclusive.
        const now = Date.now();
        const blackFriday = now >= Date.parse('2026-11-26T23:00:00Z') &&
          now < Date.parse('2026-11-27T23:00:00Z');
        const christmas = now >= Date.parse('2026-12-04T23:00:00Z') &&
          now < Date.parse('2026-12-24T23:00:00Z');

        const focus = params.getAll('focus');
        const page = focus.length === 1 && focus[0] === 'collection' ? '/' : '/rich-gift.html';
        let campaign = 'evergreen';
        if (blackFriday) campaign = 'black_friday_2026';
        if (christmas) campaign = 'christmas_2026';
        const tags = new URLSearchParams({
          utm_source: source,
          utm_medium: 'organic_social',
          utm_campaign: campaign,
          utm_content: 'profile',
        });
        destination = page + '?' + tags;
      }

      location.replace(destination);
    })();
  </script>
</head>
<body>
  <p><a href="/rich-gift.html">Explore The Rich Gift</a> · <a href="/">View the full collection</a></p>
</body>
</html>
