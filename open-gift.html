<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0909"><title>A Gift For You · The Rich Button</title><meta property="og:title" content="You've Been Gifted Nothing · The Rich Button"><meta property="og:description" content="A wonderfully unnecessary surprise is waiting for you."><meta property="og:image" content="https://therichbutton.com/gift-social.png"><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap');*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 30%,#382719,#080808 70%);color:#f1dfc2;font-family:'DM Sans',sans-serif;min-height:100dvh;display:grid;place-items:center;text-align:center;overflow-x:hidden}main{width:min(620px,100%);padding:36px 20px 50px}.eyebrow{font-size:10px;letter-spacing:.3em;color:#d5b77e}h1{font:italic clamp(40px,8vw,66px)/1.08 'Playfair Display',Georgia,serif;margin:22px 0 12px}.sub{font-size:13px;line-height:1.8;color:#c6ad87}.envelope{width:min(380px,85vw);height:270px;position:relative;display:block;margin:40px auto 22px;border:0;background:none;cursor:pointer;perspective:1000px;filter:drop-shadow(0 26px 32px #000a)}.back,.front,.flap,.letter{position:absolute;inset:0;border-radius:6px}.back{background:linear-gradient(135deg,#a57a3d,#e7ca89,#735026)}.front{z-index:3;background:linear-gradient(145deg,#b78b50 0%,#e6c58b 48%,#c39a61 100%);clip-path:polygon(0 0,50% 48%,100% 0,100% 100%,0 100%);box-shadow:inset 0 -5px 15px #6c472a88}.flap{z-index:4;background:linear-gradient(165deg,#e7c78d,#9c7038);clip-path:polygon(0 0,100% 0,50% 60%);transform-origin:top;transition:transform .85s ease}.seal{position:absolute;z-index:5;top:47%;left:50%;transform:translate(-50%,-50%);border:3px solid #f3dba6;background:radial-gradient(circle,#58371e,#24150d);color:#f4dbab;border-radius:50%;width:68px;height:68px;display:grid;place-items:center;font:italic 42px Georgia;box-shadow:0 5px 15px #0008;transition:opacity .4s}.letter{z-index:2;inset:12px 18px;background:linear-gradient(145deg,#221b18,#0b090a);border:1px solid #cba66b;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:18px;gap:9px;transition:transform 1s .4s,box-shadow 1s .4s}.letter small{font-size:9px;letter-spacing:.18em;color:#d7ba81}.letter strong{font:italic 28px Georgia;color:#ffe1ae;overflow-wrap:anywhere}.letter .message{font:italic 14px/1.45 Georgia;color:#e6d3bb;max-height:75px;overflow:auto}.letter .tier{font-size:10px;letter-spacing:.17em;color:#e8bd80}.envelope.open .flap{transform:rotateX(180deg);z-index:1}.envelope.open .seal{opacity:0}.envelope.open .letter{transform:translateY(-90px) scale(1.07);box-shadow:0 0 50px #e9c28b33;z-index:5}.envelope.open .front{z-index:3}.hint{font-size:11px;letter-spacing:.15em;color:#d8ba88}.actions{display:none;margin-top:26px;gap:14px;flex-direction:column;align-items:center}.actions.visible{display:flex}.action{background:linear-gradient(#f7dfac,#b38a4b);color:#1c140c;padding:15px 23px;border-radius:5px;text-decoration:none;font-size:11px;font-weight:700;letter-spacing:.11em}.again{border:0;background:transparent;color:#d6b77c;text-decoration:underline;cursor:pointer}.disclaimer{font-size:10px;color:#b5a18a;line-height:1.6;max-width:420px;margin:25px auto 0}.error{color:#f4c4b4}@media(max-width:480px){.envelope{height:230px}.letter strong{font-size:23px}.letter .message{font-size:12px}.envelope.open .letter{transform:translateY(-72px) scale(1.04)}}</style></head><body><main><div class="eyebrow">THE RICH BUTTON · A PRIVATE REVEAL</div><h1 id="headline">A gift for you.</h1><p class="sub" id="intro" hidden></p><button class="envelope" id="envelope" aria-label="Open your gift" type="button"><span class="back"></span><span class="letter"><small>THE RICH BUTTON®</small><strong id="name">FOR YOU</strong><span class="tier" id="edition">THE RICH GIFT</span><span class="message" id="message">Because you can.</span><small>FREE PREVIEW · NOT A PURCHASED GIFT</small></span><span class="front"></span><span class="flap"></span><span class="seal">R</span></button><div class="hint" id="hint">TOUCH THE SEAL TO OPEN</div><div class="actions" id="actions"><a class="action" id="buttonLink" href="rich-gift-button.html">✦ EXPLORE YOUR BUTTON</a><button class="again" id="again" type="button">↻ Open again</button></div><p class="disclaimer">This is a free demonstration. No payment has been made, and no membership or ownership is activated.</p></main><script>const q=new URLSearchParams(location.search),map={r:'rich-gift',g:'gold',p:'platinum',d:'diamond'};const code=q.get('c');let gift={tier:map[q.get('e')]||'rich-gift',name:q.get('n')||'',sender:q.get('f')||'',message:q.get('m')||''};if(q.has('gift')){try{gift=JSON.parse(q.get('gift'))}catch{}}function render(){const editions={'rich-gift':'THE RICH GIFT',gold:'GOLD EDITION',platinum:'PLATINUM EDITION',diamond:'DIAMOND EDITION'};const tier=editions[gift.tier]?gift.tier:'rich-gift';document.getElementById('name').textContent=(String(gift.name||'').slice(0,42)||'FOR YOU').toUpperCase();document.getElementById('edition').textContent=editions[tier];document.getElementById('headline').textContent=gift.sender?'A gift from '+String(gift.sender).slice(0,42)+'.':'A gift for you.';document.getElementById('message').textContent=String(gift.message||'Money can’t buy happiness. So I bought you this instead.').slice(0,180);document.getElementById('buttonLink').href=tier==='rich-gift'?'rich-gift-button.html':tier+'.html';}if(code){fetch('https://mhrebbssqamkuulzqcki.supabase.co/functions/v1/gift-preview?c='+encodeURIComponent(code)).then(r=>{if(!r.ok)throw Error('Unavailable');return r.json()}).then(data=>{gift=data;render()}).catch(()=>{document.getElementById('intro').hidden=false;document.getElementById('intro').textContent='This gift preview is unavailable or has expired.';document.getElementById('intro').classList.add('error');document.getElementById('envelope').disabled=true})}else render();const env=document.getElementById('envelope');env.addEventListener('click',()=>{if(env.classList.contains('open'))return;env.classList.add('open');document.getElementById('hint').textContent='A BEAUTIFULLY UNNECESSARY SURPRISE';setTimeout(()=>document.getElementById('actions').classList.add('visible'),1050)});document.getElementById('again').addEventListener('click',()=>{env.classList.remove('open');document.getElementById('actions').classList.remove('visible');document.getElementById('hint').textContent='TOUCH THE SEAL TO OPEN'});</script></body></html>
