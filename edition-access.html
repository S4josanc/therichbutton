<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Your Rich Button</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#302617,#090909 65%);color:#f3e5ce;font-family:Arial,sans-serif;text-align:center;min-height:100vh}header{padding:24px;border-bottom:1px solid #a1835355;text-align:left}header a{color:#e4c897;text-decoration:none;font:italic 28px Georgia}main{max-width:720px;margin:auto;padding:55px 20px}.eyebrow{color:#d9b87e;font-size:12px;letter-spacing:.18em}h1{font:italic clamp(36px,7vw,56px)/1.15 Georgia;margin:22px 0;color:#f1ddba}p{font-size:16px;line-height:1.7;color:#cbbba1}.button{display:grid;place-items:center;margin:40px auto 20px;width:190px;height:190px;border-radius:50%;border:10px ridge #d5b478;background:radial-gradient(circle at 35% 20%,#f6dca6,#9c7b43 65%,#60451e);color:#392810;font:92px Georgia;box-shadow:0 12px 35px #000b;cursor:pointer}.button[data-edition=platinum]{border-color:#c5cbd0;background:radial-gradient(circle at 35% 20%,#f1f4f5,#8d999f 65%,#46515c)}.button[data-edition=diamond]{border-color:#a5d0e3;background:radial-gradient(circle at 35% 20%,#e2faff,#73b3cc 65%,#356c87)}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}button.action{padding:15px 20px;border:1px solid #c4a16d;border-radius:4px;background:transparent;color:#f0d8b0;cursor:pointer;font-size:14px}button.action:first-child{background:#d6b375;color:#20170d;font-weight:bold}button:focus-visible{outline:3px solid #f7ddb1;outline-offset:4px}#notice{font-size:14px;overflow-wrap:anywhere}[hidden]{display:none!important}footer{padding:30px;color:#a68f69;font-size:12px}
</style></head><body><header><a href="./" aria-label="The Rich Button home">R.</a></header><main><span class="eyebrow">THE RICH BUTTON · YOUR EDITION</span><h1 id="title">Confirming your payment…</h1><p id="message" role="status" aria-live="polite">Please keep this page open while we prepare your button.</p><section id="ready" hidden><button id="button" class="button" aria-label="Press your Rich Button">R</button><p id="response" aria-live="polite">Go ahead. Press it.</p><div class="actions"><button class="action" id="copy" type="button">COPY PRIVATE LINK</button><button class="action" id="download" type="button">DOWNLOAD PRIVATE LINK</button></div><p id="notice">Save your private link somewhere safe to return to your button. Anyone with the link can open it.</p></section></main><footer>THE RICH BUTTON · BECAUSE YOU CAN.</footer><script>
(()=>{const title=document.getElementById('title'),message=document.getElementById('message'),ready=document.getElementById('ready'),params=new URLSearchParams(location.search),session=params.get('session_id'),token=params.get('token');let privateUrl='';async function load(){if(!session&&!token){title.textContent='Your private link is missing.';message.textContent='Use the link you saved after purchase, or contact support@therichbutton.com.';return}try{const r=await fetch('https://mhrebbssqamkuulzqcki.supabase.co/functions/v1/rich-edition-access',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(token?{token}:{session_id:session})});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to confirm payment.');if(!['gold','platinum','diamond'].includes(d.edition)||!d.token)throw Error('Your button is not ready yet.');privateUrl=location.origin+location.pathname+'?token='+encodeURIComponent(d.token);history.replaceState(null,'',privateUrl);title.textContent='Your '+d.edition.charAt(0).toUpperCase()+d.edition.slice(1)+' Button is ready.';message.textContent='Your payment has been confirmed. Your button is waiting.';document.getElementById('button').dataset.edition=d.edition;ready.hidden=false}catch(e){title.textContent='We could not confirm your button yet.';message.textContent='Keep your Stripe receipt and contact support@therichbutton.com before paying again.'}}document.getElementById('button').onclick=()=>{document.getElementById('response').textContent='Nothing happened. Perfect.'};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(privateUrl);document.getElementById('notice').textContent='Private link copied. Keep it somewhere safe.'}catch{document.getElementById('notice').textContent='Copy and save this private link: '+privateUrl}};document.getElementById('download').onclick=()=>{const url=URL.createObjectURL(new Blob(['THE RICH BUTTON · PRIVATE LINK\n\n'+privateUrl+'\n\nAnyone with this link can open your button. Keep it safe.\n'],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='rich-button-private-link.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};load()})();
</script></body></html>
