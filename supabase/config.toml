# All functions use server-side authentication suited to their purpose.
# Public state is intentionally readable; checkout requires the site's public
# API key + allowed Origin + rate limiting; order status additionally requires
# an unguessable private order token; webhook uses Stripe's signed raw payload.
[functions.rich-throne-public]
verify_jwt = false
[functions.rich-throne-checkout]
verify_jwt = false
[functions.rich-throne-order-status]
verify_jwt = false
[functions.rich-throne-webhook]
verify_jwt = false

# rich-admin validates the bearer token with Auth and restricts access to the
# confirmed administrator before any action, including Wall ordering.
[functions.rich-admin]
verify_jwt = false

# Preserve the currently deployed gateway configuration for these existing
# storefront functions. Each handler validates the origin and request type.
[functions.rich-analytics]
verify_jwt = false
[functions.rich-gift-checkout]
verify_jwt = false

[functions.rich-edition-checkout]
verify_jwt = false

# These existing endpoints validate Stripe signatures, private order tokens or
# the delivery review credential in the handler. Preserve their gateway settings.
[functions.stripe-gift-webhook]
verify_jwt = false
[functions.rich-gift-order-status]
verify_jwt = false
[functions.rich-edition-access]
verify_jwt = false
[functions.rich-delivery-review]
verify_jwt = false
